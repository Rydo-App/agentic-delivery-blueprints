# The quality gate of this repository.
#
# It runs on every push to the default branch and on every pull request, and
# it does four things: it proves that the leak scanner still works, it proves
# that the documentation checker still works, it runs the leak scan over the
# tree, and it checks the documentation.
#
# Every action is pinned to a full commit SHA, with the version in a comment.
# A pinned SHA cannot be moved, so nothing changes here without a pull request
# that says so.
#
# This workflow needs no secret. It reads the repository and it writes nothing.

name: quality

on:
  push:
    # Change this when the default branch is called something else.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  leak-scan:
    name: Leak scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: Self-test the scanner
        run: node scripts/scan-leaks.mjs --self-test
      - name: Scan the tree for anything that must not be published
        run: node scripts/scan-leaks.mjs

  documentation:
    name: Documentation check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Set up Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4
        with:
          node-version: '20'
      - name: Self-test the checker
        run: node scripts/check-docs.mjs --self-test
      - name: Check the documentation
        run: node scripts/check-docs.mjs

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [leak-scan, documentation]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Write the summary
        run: |
          {
            echo "### Quality gate"
            echo ""
            echo "| Job | Result |"
            echo "| --- | --- |"
            echo "| Leak scan | ${{ needs.leak-scan.result }} |"
            echo "| Documentation check | ${{ needs.documentation.result }} |"
            echo ""
            echo "The self-tests run before the real check, so a broken tool never reports a clean tree."
          } >> "$GITHUB_STEP_SUMMARY"
